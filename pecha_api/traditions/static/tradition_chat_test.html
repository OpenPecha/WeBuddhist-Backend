<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tradition Chat Test</title>
  <style>
    :root {
      --bg: #f4efe4;
      --surface: #fffdf8;
      --ink: #2a2118;
      --muted: #6b5f52;
      --accent: #8b1e1e;
      --accent-dark: #5c1212;
      --gold: #b8860b;
      --border: #ddd3c4;
      --user-bg: #8b1e1e;
      --assistant-bg: #f0e8da;
      --error: #b91c1c;
      --ok: #166534;
      --shadow: 0 10px 30px rgba(42, 33, 24, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(184, 134, 11, 0.12), transparent 40%),
        radial-gradient(circle at bottom left, rgba(139, 30, 30, 0.08), transparent 35%),
        var(--bg);
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      margin-bottom: 16px;
      padding: 18px 20px;
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      color: #fff8ef;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    header h1 {
      margin: 0 0 4px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.5rem;
    }

    header p {
      margin: 0;
      font-size: 0.88rem;
      opacity: 0.88;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .toolbar label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
    }

    select, input, textarea, button {
      font: inherit;
    }

    select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--surface);
      color: var(--ink);
    }

    .toolbar button {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 0.88rem;
    }

    .toolbar button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      border: none;
    }

    .chat-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 480px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.5;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      color: #fff8ef;
      border-bottom-right-radius: 4px;
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--assistant-bg);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }

    .meta-panel {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: #faf6ef;
      font-size: 0.85rem;
    }

    .meta-panel.hidden { display: none; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      border: 1px solid #d4b896;
      background: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      color: var(--ink);
    }

    .chip:hover { background: #fdf3e3; }

    .chip.question {
      border-color: #c7d2fe;
      background: #eef2ff;
    }

    .complete-banner {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #dcfce7;
      color: var(--ok);
      font-weight: 600;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .composer textarea {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.4;
    }

    .composer button {
      align-self: flex-end;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .composer button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      font-size: 0.88rem;
      min-height: 1.2em;
    }

    .status.error { color: var(--error); }
    .status.ok { color: var(--ok); }

    details.raw {
      margin-top: 14px;
      font-size: 0.82rem;
    }

    details.raw summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
    }

    details.raw pre {
      margin: 8px 0 0;
      padding: 12px;
      background: #1a2332;
      color: #e2e8f0;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .model-tag {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Tradition Chat Test</h1>
      <p>Test the LLM tradition onboarding assistant and your updated prompt.</p>
    </header>

    <div class="toolbar">
      <div>
        <label for="language">Language</label>
        <select id="language">
          <option value="EN">English (EN)</option>
          <option value="BO">Tibetan (BO)</option>
          <option value="ZH">Chinese (ZH)</option>
          <option value="HI">Hindi (HI)</option>
          <option value="NE">Nepali (NE)</option>
          <option value="MN">Mongolian (MN)</option>
        </select>
      </div>
      <button type="button" id="newChatBtn">New chat</button>
      <button type="button" id="sampleBtn">Sample opener</button>
    </div>

    <div class="chat-card">
      <div id="messages" class="messages">
        <div class="empty-state" id="emptyState">
          Start a conversation to help identify your Buddhist tradition.<br />
          Try the sample opener or type your own message below.
        </div>
      </div>

      <div id="metaPanel" class="meta-panel hidden">
        <div id="suggestionsBlock" class="hidden">
          <strong>Suggested traditions</strong>
          <div id="suggestions" class="chips"></div>
        </div>
        <div id="questionsBlock" class="hidden">
          <strong>Follow-up questions</strong>
          <div id="questions" class="chips"></div>
        </div>
        <div id="completeBanner" class="complete-banner hidden"></div>
        <div id="modelTag" class="model-tag"></div>
        <details class="raw">
          <summary>Raw JSON response</summary>
          <pre id="rawJson"></pre>
        </details>
      </div>

      <div class="composer">
        <textarea id="input" rows="1" placeholder="Describe your practice or answer a question…"></textarea>
        <button id="sendBtn" type="button">Send</button>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    const API_BASE = window.location.pathname.replace(/\/view\/?$/, "");

    const SAMPLE_OPENERS = {
      EN: "I practice meditation regularly but I'm not sure which Buddhist tradition I belong to.",
      BO: "ངས་སྒོམ་སྔོན་ལ་བསྟེན་པ་ཡོད་ཀྱང་ངའི་ཆོས་ལུགས་གང་ཡིན་མ་ཤེས།",
      ZH: "我定期练习冥想，但不确定自己属于哪个佛教传统。",
      HI: "मैं नियमित रूप से ध्यान का अभ्यास करता/करती हूँ, लेकिन मुझे नहीं पता कि मैं किस बौद्ध परंपरा से हूँ।",
      NE: "म नियमित रूपमा ध्यान अभ्यास गर्छु, तर म कुन बौद्ध परम्परासँग सम्बन्धित छु भनेर थाहा छैन।",
      MN: "Би тогтмол бясалгал хийдэг боловч аль буддын ёстойг мэдэхгүй байна.",
    };

    const messagesEl = document.getElementById("messages");
    const emptyStateEl = document.getElementById("emptyState");
    const metaPanelEl = document.getElementById("metaPanel");
    const suggestionsBlockEl = document.getElementById("suggestionsBlock");
    const suggestionsEl = document.getElementById("suggestions");
    const questionsBlockEl = document.getElementById("questionsBlock");
    const questionsEl = document.getElementById("questions");
    const completeBannerEl = document.getElementById("completeBanner");
    const modelTagEl = document.getElementById("modelTag");
    const rawJsonEl = document.getElementById("rawJson");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const languageEl = document.getElementById("language");
    const newChatBtn = document.getElementById("newChatBtn");
    const sampleBtn = document.getElementById("sampleBtn");
    const statusEl = document.getElementById("status");

    let conversation = [];
    let isLoading = false;
    let isComplete = false;

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = `status ${type}`.trim();
    }

    function renderMessages() {
      messagesEl.innerHTML = "";
      if (conversation.length === 0) {
        messagesEl.appendChild(emptyStateEl);
        emptyStateEl.style.display = "block";
        return;
      }
      emptyStateEl.style.display = "none";
      conversation.forEach((msg) => {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${msg.role}`;
        bubble.textContent = msg.content;
        messagesEl.appendChild(bubble);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMeta(data) {
      metaPanelEl.classList.remove("hidden");
      rawJsonEl.textContent = JSON.stringify(data, null, 2);
      modelTagEl.textContent = data.model ? `Model: ${data.model}` : "";

      suggestionsEl.innerHTML = "";
      const suggestions = data.suggested_traditions || [];
      if (suggestions.length > 0) {
        suggestionsBlockEl.classList.remove("hidden");
        suggestions.forEach((item) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip";
          chip.textContent = `${item.name} (${item.code})`;
          chip.addEventListener("click", () => {
            inputEl.value = `Yes, I think ${item.name} is the right tradition for me.`;
            inputEl.focus();
          });
          suggestionsEl.appendChild(chip);
        });
      } else {
        suggestionsBlockEl.classList.add("hidden");
      }

      questionsEl.innerHTML = "";
      const questions = data.follow_up_questions || [];
      if (questions.length > 0) {
        questionsBlockEl.classList.remove("hidden");
        questions.forEach((question) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "chip question";
          chip.textContent = question;
          chip.addEventListener("click", () => {
            inputEl.value = question;
            inputEl.focus();
          });
          questionsEl.appendChild(chip);
        });
      } else {
        questionsBlockEl.classList.add("hidden");
      }

      if (data.is_complete && data.selected_tradition_code) {
        completeBannerEl.classList.remove("hidden");
        completeBannerEl.textContent =
          `Onboarding complete — selected tradition: ${data.selected_tradition_code}`;
        isComplete = true;
      } else {
        completeBannerEl.classList.add("hidden");
        isComplete = false;
      }
    }

    function resetChat() {
      conversation = [];
      isComplete = false;
      metaPanelEl.classList.add("hidden");
      suggestionsBlockEl.classList.add("hidden");
      questionsBlockEl.classList.add("hidden");
      completeBannerEl.classList.add("hidden");
      rawJsonEl.textContent = "";
      modelTagEl.textContent = "";
      inputEl.value = "";
      setStatus("");
      renderMessages();
    }

    async function sendMessage(text) {
      const trimmed = text.trim();
      if (!trimmed || isLoading || isComplete) return;

      conversation.push({ role: "user", content: trimmed });
      renderMessages();
      inputEl.value = "";
      sendBtn.disabled = true;
      isLoading = true;
      setStatus("Waiting for assistant…");

      try {
        const response = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: conversation,
            language: languageEl.value,
          }),
        });

        if (!response.ok) {
          let detail = `Request failed (${response.status})`;
          try {
            const err = await response.json();
            detail = err.detail || detail;
          } catch (_) {}
          throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
        }

        const data = await response.json();
        conversation.push({ role: "assistant", content: data.message });
        renderMessages();
        renderMeta(data);
        setStatus("Response received.", "ok");
      } catch (error) {
        conversation.pop();
        renderMessages();
        setStatus(error.message || "Failed to get a response.", "error");
      } finally {
        isLoading = false;
        sendBtn.disabled = isComplete;
      }
    }

    sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(inputEl.value);
      }
    });

    newChatBtn.addEventListener("click", resetChat);
    sampleBtn.addEventListener("click", () => {
      inputEl.value = SAMPLE_OPENERS[languageEl.value] || SAMPLE_OPENERS.EN;
      inputEl.focus();
    });

    languageEl.addEventListener("change", resetChat);
    renderMessages();
  </script>
</body>
</html>

version: '3.8'
services:
  db-local:
    image: postgres:16-alpine
    container_name: pecha-database
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=pechaAdmin
      - POSTGRES_DB=pecha
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "5434:5432"
    volumes:
      - ./data/database-local:/var/lib/postgresql/data
    networks:
      - pecha-network

  mongo-local:
    image: mongo:latest
    container_name: pecha-mongodb
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pechaAdmin
      - MONGO_INITDB_DATABASE=pecha
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo-local:/data/db  # Persist MongoDB data
    networks:
      - pecha-network

  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - dragonflydata:/data

      
  # Add your API service with memory limits
  pecha-api:
    build: ../
    container_name: pecha-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://admin:pechaAdmin@db-local:5432/pecha
      - MONGO_CONNECTION_STRING=mongodb://admin:pechaAdmin@mongo-local:27017/pecha?authSource=admin
      - CACHE_CONNECTION_STRING=redis://dragonfly:6379
    ports:
      - "8000:8000"
    depends_on:
      - db-local
      - mongo-local
      - dragonfly
      - elasticsearch
    networks:
      - pecha-network
    deploy:
      resources:
        limits:
          memory: 1G        # Limit to 1GB RAM
          cpus: '1.0'       # Limit to 1 CPU
        reservations:
          memory: 512M      # Reserve 512MB RAM
          cpus: '0.5'       # Reserve 0.5 CPU

  elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
      container_name: pecha-elasticsearch
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - "ES_JAVA_OPTS=-Xms256m -Xmx512m"  # Reduced memory allocation
      ports:
        - "9200:9200"
        - "9300:9300"
      volumes:
        - elasticsearch-data:/usr/share/elasticsearch/data
      networks:
        - pecha-network
      deploy:
        resources:
          limits:
            memory: 1G
          reservations:
            memory: 512M
      ulimits:
        memlock:
          soft: -1
          hard: -1

volumes:
  dbdata6:
  dragonflydata:
  elasticsearch-data:

networks:
  pecha-network:
    driver: bridge
